name: Release

# A tag like v1.0.0 builds the signed phone APK and publishes it to a GitHub Release.
# "Run workflow" (workflow_dispatch) builds the same APK as a dry run and never publishes.
# Only the :app module is built; the workflow does not need a wear/ module to exist.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Dry-run version tag, e.g. v0.1.0 (build only, nothing is published)'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The signing secrets live in this job only. Its token cannot write to the repo.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          # No dependency cache: release builds start clean.

      - name: Derive version from tag
        id: ver
        run: bash .github/scripts/version.sh "$TAG" | tee -a "$GITHUB_OUTPUT"

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/release-notes.md"
          {
            echo
            echo "Source: https://github.com/$GITHUB_REPOSITORY/tree/$TAG (GPLv3). Checksums: SHA256SUMS.txt"
          } >> "$RUNNER_TEMP/release-notes.md"

      - name: Restore keystore
        env:
          JEZ_STORE_BASE64: ${{ secrets.JEZ_STORE_BASE64 }}
        run: |
          if [ -z "$JEZ_STORE_BASE64" ]; then
            echo "::error::Secret JEZ_STORE_BASE64 is not set (see docs/RELEASING.md)"
            exit 1
          fi
          umask 077
          printf '%s' "$JEZ_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/jez-release.jks"

      - name: Build signed release APK
        env:
          ORG_GRADLE_PROJECT_JEZ_STORE_FILE: ${{ runner.temp }}/jez-release.jks
          ORG_GRADLE_PROJECT_JEZ_STORE_PASSWORD: ${{ secrets.JEZ_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_JEZ_KEY_ALIAS: ${{ secrets.JEZ_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_JEZ_KEY_PASSWORD: ${{ secrets.JEZ_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_JEZ_VERSION_NAME: ${{ steps.ver.outputs.name }}
          ORG_GRADLE_PROJECT_JEZ_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Delete keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/jez-release.jks"

      - name: Collect, verify and checksum
        env:
          VERSION: ${{ steps.ver.outputs.name }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          out="$RUNNER_TEMP/dist"
          mkdir -p "$out"
          # The expected package name comes from the build file, not from this workflow.
          pkg="$(sed -nE 's/^[[:space:]]*applicationId[[:space:]]+"([^"]+)".*/\1/p' app/build.gradle | head -1)"
          if [ -z "$pkg" ]; then
            echo "::error::applicationId not found in app/build.gradle"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "$out/jezlauncher-$VERSION.apk"
          bash .github/scripts/verify-apk.sh "$out/jezlauncher-$VERSION.apk" "$VERSION" "$CODE" "$pkg"
          cp "$RUNNER_TEMP/release-notes.md" "$out/release-notes.md"
          (cd "$out" && sha256sum *.apk | tee SHA256SUMS.txt)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.ver.outputs.name }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 30 || 7 }}

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Write access lives here only; this job holds no signing secrets and runs no repo code.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-running the job is safe: an existing release just gets its assets replaced.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file dist/release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "JezLauncher ${TAG#v}" --notes-file dist/release-notes.md
          fi
