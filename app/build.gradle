apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.devtools.ksp'

// Optional OpenSkyLight kiosk sync of the notes (docs/KIOSK_SYNC.md). Off unless built with -Pjezlauncher.kioskSync=true:
// then the pairing screen, the QR scanner (and its camera permission) and cleartext http to the paired tailnet host come in
def kioskSync = (findProperty('jezlauncher.kioskSync') ?: 'false').toString().toBoolean()

android {
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId "io.github.hakunokina.jezlauncher"
        minSdkVersion 24
        targetSdkVersion 36
        // Release CI passes both from the tag (see docs/RELEASING.md); local builds keep the upstream values
        versionCode Integer.parseInt((project.findProperty('JEZ_VERSION_CODE') ?: '113') as String)
        versionName (project.findProperty('JEZ_VERSION_NAME') ?: 'v6.9.17') as String

        resourceConfigurations += ["en", "ar", "cs", "da", "de", "el", "es-rES", "es-rUS", "fi", "fr", "he", "hi", "hr", "hu", "in", "it", "ja", "ko", "nb", "nl", "pl", "pt-rBR", "ro", "ru-rRU", "sv", "th", "tr", "uk", "vi", "zh"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "boolean", "KIOSK_SYNC", kioskSync.toString()
    }

    sourceSets {
        main.java.srcDirs += kioskSync ? 'src/kiosk/java' : 'src/nokiosk/java'
        if (kioskSync) {
            main.res.srcDirs += 'src/kiosk/res'
            debug.manifest.srcFile 'src/kiosk/AndroidManifest.xml'
            release.manifest.srcFile 'src/kiosk/AndroidManifest.xml'
        }
    }

    signingConfigs {
        release {
            if (project.hasProperty('JEZ_STORE_FILE') && project.hasProperty('JEZ_STORE_PASSWORD')
                    && project.hasProperty('JEZ_KEY_ALIAS') && project.hasProperty('JEZ_KEY_PASSWORD')) {
                storeFile file(JEZ_STORE_FILE)
                storePassword JEZ_STORE_PASSWORD
                keyAlias JEZ_KEY_ALIAS
                keyPassword JEZ_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".debug"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = true
    }
    namespace 'app.olauncher'
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation libs.kotlin.stdlib
    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.recyclerview

    // Android lifecycle
    implementation libs.lifecycle.extensions
    implementation libs.lifecycle.viewmodel.ktx

    // Navigation
    implementation libs.navigation.fragment.ktx

    // Work Manager
    implementation libs.work.runtime.ktx

    // Room
    implementation libs.room.runtime
    implementation libs.room.ktx
    ksp libs.room.compiler

    //Material dependency
    implementation libs.material

    // QR scanner of the kiosk pairing (GMS-free); only in kiosk sync builds
    if (kioskSync) implementation libs.zxing.android.embedded

    testImplementation libs.junit
    // android.jar stubs org.json; unit tests need the real implementation (test-only, not shipped)
    testImplementation libs.org.json
    // Fake kiosk server for the sync tests
    testImplementation libs.mockwebserver

    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.ext.junit
}
